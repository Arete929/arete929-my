<!doctype html>
<!-- 파일명: index.html | my.arete929.kr 내 앱 지도(런처보드) — 비밀번호로 들어가는 나만의 화면 | @version 2.11.0 — 주소 칸을 머리글로 꺼냄 · HTML 붙여넣기(파일 올리기·미리보기) · 주소 칸 «자체 페이지» 모드(구글 주소 거치지 않음) · 주소 칸 a–z(a.arete929.kr…z) · 앱 카드에서 바로 연결 · 앱 이름 앞 이모지 아이콘(자동 추측·직접 고르기) · 마인드맵 편집(가지 추가·이름·삭제·끌어 붙이기) · 도메인 연결 선 아이콘 · 도메인 연결 모아보기 · 중간 다리(묶음 이름의 슬래시) · 지도 바탕 고정 크기+자유 끌기 · 지난 앱 이름표도 더블클릭으로 접기·펴기 · 목록을 묶음(다리)별로 나눠 보기(기본) · 이름표 더블클릭으로 묶음 접기·펴기 · 묶음 옮기기는 놓자마자 바로 바뀌고 저장은 뒤에서 · 앱을 끌어 다른 묶음 가지에 놓으면 묶음 변경 · 빈 곳 끌어 화면 이동 · 확대·축소 단추(맞춤 포함) · 고른 모양을 모든 화면에서 · 가지 끌기 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>내 앱 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--paper:#f4f1e9;--ink:#24221e;--sub:#6f6a5e;--line:#d6cfbf;--card:#fffdf8;--on:#2e7d4f;--off:#bdb6a6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Pretendard,'Malgun Gothic',sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.dh{font-family:'Do Hyeon',Pretendard,sans-serif;font-weight:400}

/* ── 머리 ── */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:10px 20px;background:rgba(244,241,233,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .dom{font-size:12px;color:var(--sub)}
.brand h1{margin:0;font-size:27px;line-height:1}
.ver{font-size:12px;font-weight:700;background:#e3dac6;color:#4a4335;border-radius:999px;padding:3px 9px}
.seg{display:flex;border:1px solid #bfb6a3;border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 11px;cursor:pointer;font-size:13px;border-left:1px solid #d9d1c0;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.seg em{font-style:normal;font-weight:700;margin-left:3px}
.stamp{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.ck{width:16px;height:16px;border-radius:50%;background:var(--off);position:relative;flex:none}
.ck::after{content:'';position:absolute;left:5px;top:3px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.stamp.fresh{color:var(--on);font-weight:700}
.stamp.fresh .ck{background:var(--on)}

/* ── 타일 ── */
.tile{--c:#555;position:relative;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:7px 7px 7px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:opacity .2s}
.nm{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.nm:hover{text-decoration:underline}
.ctl{display:flex;align-items:center;gap:6px}
.sw{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;cursor:pointer;font-size:12px;color:var(--sub);white-space:nowrap}
.sw i{width:30px;height:17px;border-radius:9px;background:var(--off);position:relative;transition:background .15s;flex:none}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.sw[aria-checked=true] i{background:var(--on)}
.sw[aria-checked=true] i::after{transform:translateX(13px)}
.sw[aria-checked=true] span{color:var(--on);font-weight:700}
.lk{margin-left:auto;display:flex;gap:4px}
.ic{width:27px;height:27px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;background:#fff;cursor:pointer;padding:0;flex:none}
.ic:hover{border-color:var(--ink)}
.ic img{width:15px;height:15px;display:block}
.ic svg{width:16px;height:16px;display:block}
.tile.priv{background:#f6f3ec}
.tile.priv .nm{color:#57524a}
main.dim .tile.x{opacity:.2}
.more{border:1.5px dashed var(--c);background:transparent;border-radius:6px;padding:9px;color:var(--sub);cursor:pointer;font-size:13px;position:relative}
.more:hover{color:var(--ink)}
.root{background:var(--ink);color:#fff;border-radius:10px;padding:16px;text-align:center}
.root .dom{font-size:12px;opacity:.7;display:block}
.root b{font-size:30px;display:block;margin:4px 0 6px;line-height:1.05}
.root .cnt{font-size:12.5px;opacity:.85}
.hubt{font-size:20px;color:var(--c)}
.hubn{font-size:11.5px;color:var(--sub)}

/* ── 가지형 ── */
.lay-a{position:relative;padding:22px 20px 30px}
.a-wrap{position:relative;z-index:1;display:grid;grid-template-columns:1fr 200px 1fr;gap:0 56px;align-items:center;max-width:1400px;margin:0 auto}
.a-side{display:flex;flex-direction:column;gap:20px}
.br{display:flex;align-items:center;gap:46px}
.br.l{flex-direction:row-reverse}
.hub{flex:none;width:112px;padding:8px;border:2px solid var(--c);border-radius:8px;background:var(--card);text-align:center}
.hub .hubt{display:block}
.kids{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.tile.row{flex-direction:row;align-items:center;gap:8px;padding:4px 5px 4px 10px;min-height:38px}
.tile.row .nm{flex:1;-webkit-line-clamp:1}
.br.l .tile{border-left-width:1px;border-right:4px solid var(--c)}
.wires{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible}
@media (max-width:1099px){
  .lay-a{padding:16px}
  .a-wrap{display:flex;flex-direction:column;align-items:stretch}
  .a-mid{order:-1}
  .tile.row .nm{-webkit-line-clamp:2}
  .sw[aria-checked=false] span{display:none}
  .a-mid .root{display:flex;align-items:baseline;gap:10px;text-align:left;padding:12px 14px}
  .a-mid .root b{font-size:24px;margin:0}
  .a-side{gap:18px;margin-left:12px;border-left:3px solid #c9c1ae;padding:18px 0 4px 18px}
  .a-side.r{padding-top:0;padding-bottom:18px}
  .br,.br.l{flex-direction:column;align-items:stretch;gap:7px;position:relative}
  .br::before{content:'';position:absolute;left:-21px;top:14px;width:16px;border-top:3px solid var(--c)}
  .hub{width:auto;text-align:left;border:0;background:none;padding:2px 0;display:flex;align-items:baseline;gap:8px}
  .kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
  .br.l .tile{border-right-width:1px;border-left:4px solid var(--c)}
}

/* ── 섬 ── */
.lay-b{position:relative;padding:22px 20px 30px}
.b-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:38px 46px;max-width:1440px;margin:0 auto;align-items:start}
.b-root{align-self:center;display:grid;place-items:center}
.b-root .root{width:210px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center}
.isl{--c:#555;background:color-mix(in srgb,var(--c) 7%,#fffdf8);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:14px;padding:11px 12px 12px;position:relative}
.ih{display:flex;align-items:baseline;gap:8px;margin:0 0 9px}
.it{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.it .sw span{display:none}
.it .sw[aria-checked=true] span{display:inline}
.it .lk{gap:3px}
.it .ic{width:25px;height:25px}
.it>.more{grid-column:1/-1}
.isl.log{--c:#6f6a5e}
.log ol{list-style:none;margin:0;padding:0;font-size:12.5px}
.log li{display:flex;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.log li:first-child{border-top:0}
.log time{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.log .p{color:var(--on);font-weight:700}
@media (max-width:1099px){
  .lay-b{padding:16px}
  .b-grid{grid-template-columns:minmax(0,1fr);gap:16px;padding-left:26px}
  .b-grid::before{content:'';position:absolute;left:8px;top:30px;bottom:20px;border-left:3px solid #c9c1ae}
  .b-root{order:-1;place-items:stretch}
  .b-root .root{width:auto;aspect-ratio:auto;border-radius:10px;display:flex;align-items:baseline;gap:10px;margin-left:-26px;padding:12px 14px;text-align:left}
  .b-root .root b{font-size:24px;margin:0}
  .isl::before{content:'';position:absolute;left:-19px;top:22px;width:18px;border-top:3px solid var(--c)}
  .isl.log{order:9}
}

/* 좁은 칸용 타일: «비공개» 글자는 숨기고 단추를 조금 작게 */
.cmp .sw span{display:none}
.cmp .sw[aria-checked=true] span{display:inline}
.cmp .lk{gap:3px}
.cmp .ic{width:25px;height:25px}
.tile.old{border-style:dashed;opacity:.8}

/* ── 원형 방사 ── */
.lay-d{padding:14px 20px 20px}
.d-stage{position:relative;margin:0 auto}
.d-world{position:absolute;left:0;top:0;width:0;height:0}
.lay-d{overflow-x:auto}
.d-world>.root{position:absolute;z-index:3;width:168px;height:168px;border-radius:50%;display:grid;place-content:center;padding:10px}
.d-world>.root b{font-size:26px}
.d-hub{position:absolute;z-index:3;border:2px solid var(--c);background:var(--card);border-radius:8px;padding:5px 10px;text-align:center;white-space:nowrap}
.d-hub .hubt{display:block;font-size:18px}
.chip{position:absolute;z-index:2;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--c);border-radius:6px;padding:4px 9px 4px 6px;white-space:nowrap;max-width:210px}
.chip.priv{background:#f6f3ec;border-style:dashed}
.chip .sw span{display:none}
.chip .sw i{width:24px;height:14px}
.chip .sw i::after{width:10px;height:10px}
.chip .sw[aria-checked=true] i::after{transform:translateX(10px)}
.cn{border:0;background:none;padding:0;cursor:pointer;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.cn:hover{text-decoration:underline}
.chip.more{padding:6px 10px;border-style:dashed;color:var(--sub);font-size:12.5px}
.d-stage{user-select:none;-webkit-user-select:none}
body:not(.guest) .d-hub,body:not(.guest) .d-sub,body:not(.guest) .chip{cursor:grab;touch-action:none}
body:not(.guest) .d-hub.dragging,body:not(.guest) .d-sub.dragging,body:not(.guest) .chip.dragging{cursor:grabbing;z-index:6;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.dragging *{pointer-events:none}
.d-sub{position:absolute;z-index:3;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));border-radius:999px;padding:3px 13px;white-space:nowrap;text-align:center}
.d-sub .hubt{display:inline;font-size:15px;color:var(--c)}
.d-sub .hubn{display:inline;margin-left:6px;font-size:11px}
.d-sub.l3{padding:2px 10px;background:color-mix(in srgb,var(--c) 7%,var(--card));border-width:1.5px}
.d-sub.l3 .hubt{font-size:13px}
.slt{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:var(--on);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.slp{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.slp>span{color:var(--sub);font-size:12px}
.letters{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:7px}
.lt{border:1px solid var(--line);border-radius:5px;background:#fff;padding:4px 0;font-weight:800;font-size:12.5px;cursor:pointer}
.lt.use{background:var(--on);color:#fff;border-color:var(--on);opacity:.55;cursor:default}
.lt.pick{outline:2px solid #1a73e8}
.pbtn.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbtn.go:disabled{opacity:.45}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pill{border:1px solid #bfb6a3;border-radius:999px;padding:4px 11px;font-size:12.5px;background:#fff}
.pill b{color:var(--on)}
.slotrow{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:8px 10px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--off);border-radius:8px;background:#fff;padding:7px 10px;margin-bottom:6px}
.slotrow.on{border-left-color:var(--on);background:var(--card)}
.slotrow.off{border-left-color:#e0b252;background:#fbf6ea}
.slotrow .dom{font-weight:800;font-size:15px;white-space:nowrap}
.slotrow .dom i{font-style:normal;color:var(--sub);font-weight:500;font-size:12.5px}
.slotrow .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.slotrow .inp{border:1.5px solid #bfb6a3;border-radius:6px;padding:6px 9px;background:#fff;font-size:16px;color:var(--ink);width:100%;font-family:inherit}
.slotrow.on .su{border-color:#7fb596}
.slotrow .sm{font-size:11.5px;color:var(--sub)}
.mseg{display:inline-flex;border:1px solid #bfb6a3;border-radius:6px;overflow:hidden;background:#fff;align-self:flex-start}
.mseg .mb{border:0;border-left:1px solid #d9d1c0;background:none;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.mseg .mb:first-child{border-left:0}
.mseg .mb.on{background:var(--ink);color:#fff}
.slotrow [hidden]{display:none!important}
.pgbox{display:flex;flex-direction:column;gap:6px}
.slotrow .sh{font-family:Consolas,'Courier New',monospace;font-size:13px;min-height:130px;resize:vertical;white-space:pre;overflow:auto}
.pgtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pgfile{display:inline-block;cursor:pointer}
.slotrow .ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slotrow .btn{padding:6px 10px;font-size:12.5px;text-decoration:none;color:var(--ink);display:inline-block}
.slotrow .btn.f{color:#fff}
.ssw{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;cursor:pointer;font-size:12px;color:var(--sub);font-family:inherit}
.ssw i{width:30px;height:17px;border-radius:9px;background:var(--off);position:relative;display:inline-block}
.ssw i::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.ssw.on i{background:var(--on)}.ssw.on i::after{left:15px}.ssw.on{color:var(--on);font-weight:700}
@media (max-width:640px){.slotrow{grid-template-columns:1fr}}
.mm{position:fixed;z-index:40;display:flex;gap:4px;background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:5px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.mm[hidden]{display:none}
.mm button{border:0;background:#f1ece0;border-radius:7px;padding:8px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.mm button:hover{background:#e3dac6}
.mm .dg{color:#b5502f}
.mm-in{position:fixed;z-index:60;font:inherit;font-size:16px;font-weight:700;padding:7px 11px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);outline:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.sel{outline:3px solid #1a73e8;outline-offset:3px}
.root.drop{box-shadow:0 0 0 7px rgba(47,122,85,.45)}
.ico{display:inline-block;margin-right:5px;font-size:14px;line-height:1;flex:none;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-style:normal}
.pk.ek{font-size:18px;padding:4px 8px;line-height:1.2}
.fnote.in{display:inline;margin:0 0 0 6px}
.grp h3.sub.d2{margin-left:18px;font-size:13px}.grp h3.sub.d3{margin-left:36px;font-size:12.5px}.grp h3.sub.d4{margin-left:54px;font-size:12.5px}
.fnote{display:block;font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap}
.d-sub.drop{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 26%,var(--card))}
.d-hub.drop{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.br.drop,.isl.drop{outline:3px dashed var(--c);outline-offset:4px}
@media (min-width:1100px){
  body:not(.guest) .lay-a .hub,body:not(.guest) .lay-a .tile,body:not(.guest) .lay-b .ih,body:not(.guest) .lay-b .tile{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  body:not(.guest) .lay-a .dragging,body:not(.guest) .lay-b .dragging{cursor:grabbing;z-index:6;box-shadow:0 8px 20px rgba(0,0,0,.2)}
}
/* 확대·축소: 지도 전체를 .zin 안에 넣고 scale 로 키운다. .zbox 가 키운 만큼의 자리를 잡아 준다 */
.zbox{position:relative;margin:0 auto}
.zin{position:relative;transform-origin:0 0;cursor:grab}
.zin button,.zin a,.zin .sw{cursor:pointer}
main.panning,main.panning *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.lay-a,.lay-b,.lay-e,.lay-f{overflow-x:auto}
.zoom{position:fixed;right:14px;bottom:14px;z-index:30;display:flex;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.18);overflow:hidden}
.zoom[hidden]{display:none}
.zoom button{border:0;border-left:1px solid #d9d1c0;background:none;min-width:42px;height:40px;padding:0 10px;font:inherit;font-size:19px;font-weight:700;cursor:pointer;color:var(--ink)}
.zoom button:first-child{border-left:0}
.zoom button:hover{background:#efe9da}
.zoom button:disabled{opacity:.35;cursor:default}
.zoom .zv{font-size:12.5px;min-width:58px;font-variant-numeric:tabular-nums}
.zoom .zf{font-size:13px}
.pop{position:fixed;z-index:50;width:236px;background:var(--card);border:1px solid #bfb6a3;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:11px}
.pop b{display:block;font-size:14px;margin-bottom:2px}
.pop small{color:var(--sub);font-size:12px}
.pb{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.pbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:5px 8px;font-size:12.5px;cursor:pointer}
.pbtn:hover{border-color:var(--ink)}
.pbtn img,.pbtn svg{width:15px;height:15px}

/* ── 조직도 ── */
.lay-e{padding:18px 20px 26px}
.e-top{display:flex;justify-content:center}
.e-top .root{padding:11px 26px;display:flex;align-items:baseline;gap:10px;position:relative}
.e-top .root b{margin:0;font-size:28px}
.e-top .root::after{content:'';position:absolute;left:50%;top:100%;height:22px;border-left:3px solid var(--ink)}
.e-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 14px;margin:22px auto 0;position:relative;max-width:1440px}
.e-cols::before{content:'';position:absolute;top:0;left:calc(100% / var(--n) / 2);right:calc(100% / var(--n) / 2);border-top:3px solid var(--ink)}
.e-col{position:relative;padding-top:22px;min-width:0}
.e-col::before{content:'';position:absolute;top:0;left:50%;height:22px;border-left:3px solid var(--c)}
.e-hub{border:2px solid var(--c);background:var(--card);border-radius:8px;text-align:center;padding:6px}
.e-hub .hubt{display:block}
.e-list{position:relative;margin-left:14px;padding:12px 0 0 14px;border-left:3px solid var(--c);display:flex;flex-direction:column;gap:7px}
.e-list>.tile::before,.e-list>.more::before{content:'';position:absolute;left:-18px;top:50%;width:14px;border-top:3px solid var(--c)}
@media (max-width:1099px){
  .lay-e{padding:16px}
  .e-top .root{width:100%;padding:12px 14px}
  .e-top .root::after,.e-cols::before,.e-col::before{display:none}
  .e-cols{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px;margin-top:16px}
  .e-hub{text-align:left;display:flex;align-items:baseline;gap:8px}
  .e-hub .hubt{display:inline}
}

/* ── 학기 연표 ── */
.lay-f{padding:18px 20px 26px}
.f-grid{display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));max-width:1440px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.f-corner{padding:8px;border-bottom:2px solid var(--ink)}
.f-corner .root{padding:8px 6px}
.f-corner .root b{font-size:19px;margin:2px 0}
.f-corner .root .cnt{font-size:11px}
.f-term{padding:12px 12px 10px;border-bottom:2px solid var(--ink);border-left:1px solid var(--line);position:relative;display:flex;align-items:baseline;gap:8px}
.f-term b{font-size:21px}
.f-term small{font-size:12px;font-weight:700;color:#fff;background:var(--on);border-radius:999px;padding:2px 8px}
.f-term:not(:last-child)::after{content:'';position:absolute;right:-9px;bottom:-9px;z-index:2;width:0;height:0;border-left:10px solid var(--ink);border-top:8px solid transparent;border-bottom:8px solid transparent}
.now{background:#eef4ec}
.f-lane{padding:10px;border-bottom:1px solid var(--line);border-left:5px solid var(--c);display:flex;flex-direction:column;justify-content:center}
.f-lane .hubt{display:block}
.f-cell{padding:8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;align-content:start}
.f-cell>.more{grid-column:1/-1}
.f-narrow{display:none}
@media (max-width:1099px){
  .lay-f{padding:16px}
  .f-wide{display:none}
  .f-narrow{display:block;margin-left:10px;padding-left:20px;border-left:3px solid #c9c1ae}
  .f-sec{margin-bottom:16px}
  .f-sec.now{background:none}
  .f-sec h3{position:relative;font-size:23px;margin:0 0 6px;display:flex;align-items:baseline;gap:8px}
  .f-sec h3 i{position:absolute;left:-31px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:4px solid var(--ink)}
  .f-sec.now h3 i{border-color:var(--on)}
  .f-sec h3 small{font-family:Pretendard;font-size:12px;font-weight:700;color:#fff;background:var(--on);border-radius:999px;padding:2px 8px}
  .f-group{margin:4px 0 12px}
  .f-gl{font-size:12.5px;color:var(--c);font-weight:700}
  .f-gt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:5px}
  .f-gt>.more{grid-column:1/-1}
}

/* ── 설정 ── */
.setbtn{border:1px solid #bfb6a3;background:var(--card);border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.setbtn:hover{border-color:var(--ink)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(36,34,30,.42);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);border-radius:10px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px 20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.dlg-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.dlg-h h2{margin:0;font-size:24px}
.dlg-x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.dlg h3{font-size:15px;margin:16px 0 8px}
.dlg .hint{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.lays{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.lay{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 8px 9px;cursor:pointer;text-align:left}
.lay svg{display:block;width:100%;height:auto;border-radius:4px;background:#f4f1e9;margin-bottom:7px}
.lay b{display:block;font-size:14px}
.lay small{font-size:11.5px;color:var(--sub);line-height:1.35;display:block;margin-top:2px}
.lay.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:#fbf8f1}
.lay.on small::before{content:'사용 중 · ';color:var(--on);font-weight:700}
.lay .def{font-size:11px;font-weight:700;color:#4a4335;background:#e3dac6;border-radius:999px;padding:1px 7px;margin-left:4px}
.savedat{font-size:12.5px;color:var(--sub);margin-top:10px;font-variant-numeric:tabular-nums}
.savedat.fresh{color:var(--on);font-weight:700}

/* ── 목록 보기 ── */
.lay-list{padding:18px 20px 30px;max-width:1240px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lhead .lab{font-size:13px;color:var(--sub)}
.grp{margin:0 0 18px}
.grp h2{font-size:21px;margin:0 0 7px;display:flex;align-items:baseline;gap:8px}
.grp h2.gc{color:var(--c);border-left:6px solid var(--c);padding-left:10px}
.grp h3.sub{margin:12px 0 5px;font-size:13.5px;font-weight:700;color:var(--c);border-left:4px solid var(--c);padding-left:8px;display:flex;align-items:baseline;gap:6px}
.grp h3.sub small{font-weight:400;color:var(--sub);font-size:12px}
.grp h2 small{font-family:Pretendard;font-size:12.5px;color:var(--sub)}
.lrow{--c:#555;display:grid;grid-template-columns:minmax(0,1.7fr) 92px 92px 150px 128px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:6px 8px 6px 10px;margin-bottom:5px}
.lrow.priv{background:#f6f3ec}
.lrow .nm{-webkit-line-clamp:1}
.cat{font-size:12px;color:var(--c);font-weight:700;white-space:nowrap}
.cat .bdg{display:none}
.bdg{display:flex;gap:5px;flex-wrap:wrap}
.bd{font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:3px 6px;background:#fff;white-space:nowrap}
.bd.no{color:#aaa29a;border-style:dashed;background:transparent}
.bd b{font-weight:700}
.lrow .lk{margin:0;justify-content:flex-end}
@media (max-width:760px),(orientation:landscape) and (max-height:520px){
  .lay-list{padding:14px 16px}
  .lrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n n" "c c" "s l";row-gap:7px}
  .lrow .nm{grid-area:n;-webkit-line-clamp:2}
  .lrow .cat{grid-area:c;display:flex;gap:8px}
  .lrow .sw{grid-area:s}
  .lrow .bdg{display:none}
  .lrow .cat .bdg{display:flex}
  .lrow .lk{grid-area:l}
}

/* ── 바닥 · 토스트 ── */
.foot{text-align:center;font-size:12px;color:var(--sub);padding:20px 16px 26px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* 폰 세로: 머리는 흘려보내고 저장 시각은 아래 띠로 고정 */
@media (max-width:700px){
  .top{position:static;padding:10px 16px;backdrop-filter:none}

  .stamp.fresh{color:#9fe0b6}
  body{padding-bottom:40px}
  .sw span{display:none}
}

  .brand{margin:0;flex-wrap:wrap;gap:6px}
  .seg{flex-direction:column}
  .seg button{border-left:0;border-top:1px solid #d9d1c0;text-align:left}
  .seg button:first-child{border-top:0}
  .stamp{position:static;white-space:normal;background:none;color:var(--sub);padding:0;justify-content:flex-start;margin-top:auto}
  .stamp.fresh{color:var(--on)}
  main{grid-column:1;grid-row:1;min-width:0}
  .foot{grid-column:1;grid-row:2}
  .toast{bottom:16px}
}

const _d=new Date(), NY=_d.getFullYear()%100, NM=_d.getMonth()+1;
const SCHOOL_Y=NM<=2?NY-1:NY, NOW_TERM=SCHOOL_Y+'-'+((NM>=3&&NM<=8)?1:2);
function termOf(a){
  if(/^\d\d-[12]$/.test(a.term||'')) return a.term;
  const m=String(a.n).match(/^[^0-9A-Za-z가-힣]*(?:20)?(\d\d)(?!\d)/);
  if(m){const y=+m[1]; if(y>=20&&y<=SCHOOL_Y){ if(/1학기/.test(a.n)) return y+'-1'; if(/2학기/.test(a.n)||y<SCHOOL_Y) return y+'-2'; }}

  if(u){const y=+u[1]%100, mo=+u[2]; return mo<=2?(y-1)+'-2':mo<=8?y+'-1':y+'-2'}
  return NOW_TERM;
}
const termName=t=>`20${t.slice(0,2)} ${t.slice(3)}학기`;
function recentTerms(n){const out=[];let y=SCHOOL_Y,s=+NOW_TERM.slice(3);for(let i=0;i<n;i++){out.push(y+'-'+s);if(s===2)s=1;else{s=2;y--}}return out}

function layA(){

  visCats().forEach(c=>{if(r<=l){R.push(c);r+=weight(c)}else{L.push(c);l+=weight(c)}});

function layB(){

/* 원형 방사 — 묶음 이름의 슬래시( / ) 하나가 한 단계. «체육수업 / 3학년 / 베이스볼5» 는 체육수업 › 3학년 › 베이스볼5 */
const chip=(a,c)=>`<div class="chip ${a.pub?'pub':'priv'}" style="--c:${c.c}" data-tid="${a.id}" data-cat="${c.k}">${sw(a)}<button class="cn" data-pop="${a.id}" title="${esc(a.n)}">${ic(a)}${esc(a.n)}${slb(a)}</button></div>`;
let NODES=[], NODEMAP={}, ROOTS=[], AR_NODE=null;
const directOf=n=>n.cat?vis(n.cat):[];
const totalOf=n=>n.k==='ar'?(n.cat?n.cat.apps.length:0):directOf(n).length+n.kids.reduce((s,k)=>s+totalOf(k),0);
const allAppsOf=n=>directOf(n).concat(...n.kids.map(allAppsOf));
const wN=n=>n.k==='ar'?(OPEN_AR?vis(n.cat).length:1)+1.6:directOf(n).length+n.kids.reduce((s,k)=>s+wN(k),0)+1.6;
const isFoldN=n=>n.k!=='ar'&&!!FOLD[n.key];
const subKs=n=>[n.k].concat(...n.kids.map(subKs));
function buildTree(){
  NODES=[]; NODEMAP={}; ROOTS=[]; AR_NODE=null;
  visCats().filter(c=>c.k!=='ar').forEach(c=>{
    let parent=null, path='';
    c.n.split(' / ').forEach((sg,i)=>{
      path=i?path+' / '+sg:sg;
      let nd=NODES.find(x=>x.key===path);
      if(!nd){ nd={k:null,key:path,name:sg,depth:i,parent,kids:[],cat:null,c:c.c}; NODES.push(nd); (parent?parent.kids:ROOTS).push(nd) }
      parent=nd;
    });
    parent.cat=c; parent.k=c.k;
  });
  NODES.forEach((n,i)=>{ if(!n.k) n.k='p'+i; NODEMAP[n.k]=n });
  const ar=visCats().find(c=>c.k==='ar');
  if(ar){ AR_NODE={k:'ar',key:'지난 앱',name:'지난 앱',depth:0,parent:null,kids:[],cat:ar,c:ar.c}; NODEMAP.ar=AR_NODE }
}
const nodeTxt=n=>n.depth
  ?`<b class="dh hubt">${esc(n.name)}</b><small class="hubn" data-th="${n.k}"></small>${isFoldN(n)?'<small class="fnote in">접힘</small>':''}`
  :`<b class="dh hubt">${esc(n.name)}</b><small class="hubn" data-th="${n.k}"></small>${isFoldN(n)?'<small class="fnote">접힘 · 두 번 누르면 펼쳐요</small>':''}`;
function nodeHTML(n){
  const hub=`<div class="${n.depth?'d-sub'+(n.depth>1?' l3':''):'d-hub'}" style="--c:${n.c}" data-k="${n.k}" data-p="${n.parent?n.parent.k:''}">${nodeTxt(n)}</div>`;
  if(isFoldN(n)) return hub;
  if(n.k==='ar') return hub+(OPEN_AR?vis(n.cat).map(a=>chip(a,n.cat)).join(''):`<button class="chip more" style="--c:${n.c}" data-more data-cat="ar">지난 앱 ${vis(n.cat).length}개 펼치기</button>`);
  return hub+n.kids.map(nodeHTML).join('')+directOf(n).map(a=>chip(a,n.cat)).join('');
}
function layD(){
  const roots=ROOTS.concat(AR_NODE?[AR_NODE]:[]);
  return `<div class="d-stage"><div class="d-world">${rootHTML()}${roots.map(nodeHTML).join('')}<svg class="wires"></svg></div></div>`;
}
function placeD(){
  const st=main.querySelector('.d-stage'); if(!st) return;
  const W=DW, roots=ROOTS.concat(AR_NODE?[AR_NODE]:[]).filter(n=>st.querySelector(`[data-k="${n.k}"]`)); if(!roots.length) return;
  const total=roots.reduce((s,n)=>s+wN(n),0), R=[.34,.52,.66,.76,.84];
  const put=(el,x,y)=>{el._a=[x,y];el.style.left=x+'px';el.style.top=y+'px'};
  function attempt(H){
    st.style.height=H+'px';
    const cx=W/2, cy=H/2, RX=W/2-6, RY=H/2-6, boxes=[], M=5, jobs=[];
    const root=st.querySelector('.root'), rw=root.offsetWidth, rh=root.offsetHeight;
    put(root,cx-rw/2,cy-rh/2); boxes.push({x:cx-rw/2,y:cy-rh/2,w:rw,h:rh});
    const hit=b=>b.x<4||b.y<4||b.x+b.w>W-4||b.y+b.h>H-4||boxes.some(o=>b.x<o.x+o.w+M&&o.x<b.x+b.w+M&&b.y<o.y+o.h+M&&o.y<b.y+b.h+M);
    /* 1) 이름표(큰 다리·중간 다리)를 단계마다 안쪽 → 바깥 둥근 띠에 놓는다 */
    function node(n,a0,a1){
      const el=st.querySelector(`[data-k="${n.k}"]`); if(!el) return;
      const mid=(a0+a1)/2, r=R[Math.min(n.depth,4)], w=el.offsetWidth, h=el.offsetHeight;
      const x=cx+Math.cos(mid)*RX*r-w/2, y=cy+Math.sin(mid)*RY*r-h/2;
      put(el,x,y); boxes.push({x,y,w,h});
      const kids=isFoldN(n)?[]:n.kids, nd=(isFoldN(n)||n.k==='ar')?0:directOf(n).length;
      const tw=kids.reduce((s,k)=>s+wN(k),0)+nd; let a=a0, dMid=mid;
      if(kids.length&&tw){ const span=a1-a0; kids.forEach(k=>{const b=a+span*wN(k)/tw; node(k,a,b); a=b}); if(nd) dMid=(a+a1)/2 }
      jobs.push({n,mid:dMid,span:(a1-a0)/2-.02});
    }
    let ang=-Math.PI/2-Math.PI*wN(roots[0])/total;
    roots.forEach(n=>{const a1=ang+2*Math.PI*wN(n)/total; node(n,ang,a1); ang=a1});
    /* 2) 앱 칸은 깊은 이름표부터 — 자기 이름표 바깥쪽에서 빈 자리를 찾아 놓는다 */
    let ok=true;

function mmKeyMap(obj,from,to,drop){   /* 가지 이름이 바뀌면 그 가지의 끌어 둔 위치·접힘 기록도 새 이름으로 */

    const m=k.match(/^(h:)(.*?)(@[ab])?$/), f=m||k.match(/^()(.*)()$/); let path=m?m[2]:k;
    if(!m&&(k.indexOf(':')>0&&/^[am]:/.test(k))){ out[k]=obj[k]; return }
    if(drop&&insidePath(path,from)) return;
    const np=to==null?path:catMap(path,from,to); out[(m?m[1]:'')+np+(m&&m[3]?m[3]:'')]=obj[k];
  }); return out;
}

function mmRename(n,name){

  if(from==='기타'){ toast('«기타»는 이름을 바꿀 수 없어요'); return }

  mmDo(()=>{
    const seen=new Set(), list=[]; (STATE.cats||[]).forEach(c=>{const x=catMap(c,from,to); if(x&&!seen.has(x)){seen.add(x);list.push(x)}});
    STATE.apps.forEach(a=>{ const x=catMap(a.tab,from,to); if(x!==a.tab){ a.tab=x; if(!seen.has(x)){seen.add(x);list.push(x)} } });
    STATE.cats=list; POS=mmKeyMap(POS,from,to); FOLD=mmKeyMap(FOLD,from,to); savePos('가지 위치');

function mmReparent(n,target){   /* target=null → 가운데에 붙여 큰 가지로 */

function hostRect(){const hb=main.querySelector('.zin').getBoundingClientRect(), k=Z||1;return el=>{const r=el.getBoundingClientRect();return{l:(r.left-hb.left)/k,r:(r.right-hb.left)/k,t:(r.top-hb.top)/k,b:(r.bottom-hb.top)/k,cx:((r.left+r.right)/2-hb.left)/k,cy:((r.top+r.bottom)/2-hb.top)/k}}}
const curve=(x1,y1,x2,y2)=>{const m=(x1+x2)/2;return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`};
function sizeSvg(svg){const zi=main.querySelector('.zin');svg.setAttribute('width',zi.scrollWidth);svg.setAttribute('height',zi.scrollHeight)}
function wiresA(){
  const svg=main.querySelector('.wires'); if(!svg) return;
  if(innerWidth<1100){svg.innerHTML='';return}
  sizeSvg(svg); const R=hostRect(), root=R(main.querySelector('.root')); let s='';
  main.querySelectorAll('.br').forEach(br=>{
    const L=br.classList.contains('l'), c=br.style.getPropertyValue('--c'), h=R(br.querySelector('.hub'));
    s+=`<path d="${curve(L?root.l:root.r,root.cy,L?h.r:h.l,h.cy)}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    const hx=L?h.l:h.r;
    br.querySelectorAll('.kids>.tile,.kids>.more').forEach(t=>{const r=R(t);s+=`<path d="${curve(hx,h.cy,L?r.r:r.l,r.cy)}" stroke="${c}" stroke-width="1.6" fill="none" opacity=".75"/>`});
  });
  svg.innerHTML=s;
}
function wiresB(){
  const svg=main.querySelector('.wires'); if(!svg) return;
  if(innerWidth<1100){svg.innerHTML='';return}
  sizeSvg(svg); const R=hostRect(), root=R(main.querySelector('.b-root .root'));
  const cx=root.cx, cy=root.cy, rad=(root.r-root.l)/2; let s='';
  main.querySelectorAll('.isl[data-k]').forEach(el=>{
    const r=R(el), c=el.style.getPropertyValue('--c');
    const tx=Math.max(r.l,Math.min(cx,r.r)), ty=Math.max(r.t,Math.min(cy,r.b));
    const dx=tx-cx, dy=ty-cy, d=Math.hypot(dx,dy)||1;
    s+=`<path d="M${cx+dx/d*rad},${cy+dy/d*rad} L${tx},${ty}" stroke="${c}" stroke-width="5" stroke-linecap="round" opacity=".55"/><circle cx="${tx}" cy="${ty}" r="6" fill="${c}"/>`;
  });
  svg.innerHTML=s;
}
const dNarrow=()=>false;   /* 원형 방사는 폭과 상관없이 방사형으로 둔다(좁으면 옆으로 밀어서 본다) */

/* 확대·축소를 한 번도 안 만졌다면 창 폭에 맞춰 한눈에 보이게(저장 안 함) — 배치는 그대로, 크기만 맞춘다 */

}

      mk('걷기',[["'25아침걷기 순위 대시보드"]]))};
  }
  const S=DEMO_STATE, find=k=>S.apps.find(a=>a.n===k.n&&a.u===k.u), copy=()=>JSON.parse(JSON.stringify(S));
  return new Promise(res=>setTimeout(()=>{
    if(act==='state') return res(copy());
    if(act==='pub'){find(d.key).pub=d.pub;S.saved.share=S.saved.last=now();return res({ok:true,savedAt:S.saved.share})}
    if(act==='layout'){S.layout=d.layout;S.saved.layout=S.saved.last=now();return res({ok:true,savedAt:S.saved.layout})}
    if(act==='pos'){S.pos=d.pos;S.saved.layout=S.saved.last=now();return res({ok:true,savedAt:S.saved.layout})}
    if(act==='edit'){Object.assign(find(d.key),d.data);S.saved.app=S.saved.last=now();return res({ok:true,savedAt:S.saved.app,state:copy()})}
    if(act==='add'){S.apps.push(Object.assign({pub:false,feed:false,upd:'2026-11-17',kind:'app',ver:''},d.data));S.saved.app=S.saved.last=now();return res({ok:true,savedAt:S.saved.app,state:copy()})}
    if(act==='move'){find(d.key).tab=d.tab;S.saved.app=S.saved.last=now();return res({ok:true,savedAt:S.saved.app,state:copy()})}
    if(act==='slotSet'){S.slots=S.slots||{}; const l=String(d.letter||'').toLowerCase(); if(!/^[a-z]$/.test(l)) return res({ok:false,error:'칸은 a 부터 z 까지입니다.'}); if(d.m==='page'){S.pages=S.pages||{}; if(d.html!=null){S.pages[l]=String(d.html)} else if(!(S.slots[l]&&S.slots[l].m==='page')) return res({ok:false,error:'HTML 내용을 붙여 넣어 주세요.'}); S.slots[l]={u:'',n:d.n||'',m:'page',on:d.on!==false,at:now(),pl:(S.pages[l]||'').length}} else if(d.m==='host'){S.slots[l]={u:'',n:d.n||'',m:'host',on:d.on!==false,at:now()}} else if(!d.u){delete S.slots[l]} else if(!/^https:\/\//i.test(d.u)){return res({ok:false,error:'링크는 https:// 로 시작해야 합니다.'})} else {S.slots[l]={u:d.u,n:d.n||'',m:'go',on:d.on!==false,at:now()}} S.saved.slots=S.saved.last=now(); return res({ok:true,savedAt:S.saved.slots,slots:JSON.parse(JSON.stringify(S.slots))})}
    if(act==='slotPage'){return res({ok:true,html:(S.pages&&S.pages[String(d.letter||'')])||''})}
    if(act==='catAdd'){const p=normTab(d.path); if(S.cats.indexOf(p)<0) S.cats.push(p); S.saved.app=S.saved.last=now(); return res({ok:true,savedAt:S.saved.app,state:copy()})}
    if(act==='catRename'){const f=normTab(d.from), t=normTab(d.to), sn=new Set(), l=[]; S.cats.forEach(c=>{const x=catMap(c,f,t); if(!sn.has(x)){sn.add(x);l.push(x)}}); S.apps.forEach(a=>{const x=catMap(a.tab,f,t); if(x!==a.tab){a.tab=x; if(!sn.has(x)){sn.add(x);l.push(x)}}}); S.cats=l; S.saved.app=S.saved.last=now(); return res({ok:true,savedAt:S.saved.app,state:copy()})}
    if(act==='catDel'){const p=normTab(d.path), par=parentPath(p)||'기타'; S.cats=S.cats.filter(c=>!insidePath(c,p)); let m=0; S.apps.forEach(a=>{if(insidePath(a.tab,p)){a.tab=par;m++}}); if(m&&S.cats.indexOf(par)<0) S.cats.push(par); S.saved.app=S.saved.last=now(); return res({ok:true,savedAt:S.saved.app,state:copy()})}
    if(act==='del'){S.apps.splice(S.apps.indexOf(find(d.key)),1);S.saved.app=S.saved.last=now();return res({ok:true,savedAt:S.saved.app,state:copy()})}
    res({ok:true,tok:'demo',hasPw:true});
  },120));
}

$('#footLine').textContent=`${$('#appTitle').textContent} · ${CFG.version} · ${CFG.deployed?'배포 '+CFG.deployed+' (KST)':'배포 전'}`;
(async function(){
  const m=location.hash.match(/setup=([^&]+)/);
  if(m){SETUP=decodeURIComponent(m[1]);history.replaceState(null,'',location.pathname+location.search)}
  if(DEMO){
    const g=QS.get('gate'); if(g){main.innerHTML='';gate(g);return}
    await loadState(); if(QS.get('view')==='list'){VIEW='list';render()} if(QS.get('set')==='1') openSet(); if(QS.get('edit')==='1') openEdit(STATE.apps[13]);
    return;
  }
  try{TOK=localStorage.getItem('my-tok')||''}catch(e){}
  if(SETUP){main.innerHTML='';gate('setup');return}
  if(TOK){loadState();return}
  main.innerHTML='';
  try{const j=await api('status'); gate(j.hasPw?'login':'nosetup')}
  catch(e){main.innerHTML=`<div class="wait">${esc(e.message)}<br><br><button class="btn" id="reload">다시 불러오기</button></div>`}
})();
if(document.fonts) document.fonts.ready.then(post);
